name: Deploy to GitHub Pages

# Manual only. This repository currently serves Pages from the gh-pages
# branch, and an Actions deployment is rejected while that is the source
# ("Deployments are only allowed from gh-pages"). Switch Settings → Pages →
# Source to "GitHub Actions" before running this; the workflow token cannot
# change that setting itself. Until then, deploy with scripts/deploy-gh-pages.sh.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
